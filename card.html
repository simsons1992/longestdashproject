<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card design</title>
    <link rel="stylesheet" href="cardstyle.css">
</head>

<body>
    <div class="ordercard">
        <input type="text" class="title" placeholder="TITLE">
        <button class="status">Status</button>
        <input type="text" class="note" placeholder="note...">
        <input type="text" class="phone" placeholder="phone...">
        <input type="email" class="email" placeholder="email...">

        <div class="divider"></div>

        <div class="bottom-row">
            <input type="number" class="PR" placeholder="pr...">
            <input type="number" class="revenue" placeholder="Revenue...">
        </div>
    </div>
</body>

</html>
